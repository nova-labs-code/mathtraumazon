<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<meta name="robots" content="noindex, nofollow">

<title>ADD.</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    touch-action: manipulation;
    font-family: Arial, Helvetica, sans-serif;
    background: #090914;
    color: white;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    transition:
        background 0.4s ease,
        filter 0.25s ease,
        transform 0.15s ease;
}

button {
    font: inherit;
    border: 0;
    outline: none;
    cursor: pointer;
    touch-action: manipulation;
}

#app {
    width: min(94vw, 700px);
    margin: auto;
    padding: 20px;
}

.screen {
    text-align: center;
}

.hidden {
    display: none !important;
}

/* =========================
   START SCREEN
========================= */

#startScreen {
    padding: 35px 20px;
}

.logo {
    font-size: clamp(4rem, 18vw, 8rem);
    font-weight: 900;
    letter-spacing: -0.08em;
    line-height: 0.9;
    margin-bottom: 15px;
}

.subtitle {
    color: #9da0c9;
    font-size: 1rem;
    margin-bottom: 35px;
}

.startButton {
    width: 100%;
    max-width: 360px;
    padding: 20px;
    border-radius: 18px;
    background: #635bff;
    color: white;
    font-size: 1.25rem;
    font-weight: 800;
    box-shadow: 0 12px 35px rgba(99, 91, 255, 0.3);
    transition: transform 0.15s ease, filter 0.15s ease;
}

.startButton:active {
    transform: scale(0.96);
}

.startButton:hover {
    filter: brightness(1.1);
}

/* =========================
   GAME
========================= */

#gameScreen {
    width: 100%;
}

.topBar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.levelLabel {
    font-size: 0.95rem;
    color: #aaaed5;
    font-weight: 700;
}

.progressText {
    font-size: 0.95rem;
    color: #aaaed5;
}

.progressBar {
    width: 100%;
    height: 8px;
    border-radius: 100px;
    background: #1b1b2b;
    overflow: hidden;
    margin-bottom: 25px;
}

.progressFill {
    width: 0%;
    height: 100%;
    background: #635bff;
    transition: width 0.2s ease;
}

.questionCard {
    background: #111122;
    border: 1px solid #252542;
    border-radius: 25px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
}

.question {
    font-size: clamp(2.5rem, 13vw, 5rem);
    font-weight: 900;
    letter-spacing: -0.04em;
    margin-bottom: 18px;
}

.answer {
    min-height: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 20px;
    border-radius: 15px;
    background: #080810;
    border: 2px solid #292946;
    font-size: 2.4rem;
    font-weight: 800;
    overflow: hidden;
    word-break: break-all;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin: 18px 0;
    font-weight: 700;
}

.correctStat {
    color: #65e6a5;
}

.wrongStat {
    color: #ff6578;
}

/* =========================
   NUMPAD
========================= */

.numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.numButton {
    min-height: 68px;
    border-radius: 17px;
    background: #18182a;
    color: white;
    border: 1px solid #292946;
    font-size: 1.45rem;
    font-weight: 800;
    transition:
        transform 0.08s ease,
        background 0.08s ease;
}

.numButton:active {
    transform: scale(0.91);
    background: #292946;
}

.deleteButton {
    background: #241820;
    color: #ff7d8d;
}

.enterButton {
    background: #635bff;
    color: white;
}

.zeroButton {
    grid-column: 2;
}

/* =========================
   FINISH SCREEN
========================= */

#finishScreen {
    padding: 30px 15px;
}

.finishTitle {
    font-size: clamp(3rem, 13vw, 6rem);
    font-weight: 900;
    margin-bottom: 20px;
}

.finalStats {
    background: #111122;
    border: 1px solid #252542;
    border-radius: 22px;
    padding: 25px;
    margin-bottom: 20px;
}

.finalNumber {
    font-size: 3rem;
    font-weight: 900;
    margin: 8px;
}

.finishButton {
    width: 100%;
    padding: 18px;
    border-radius: 16px;
    background: #635bff;
    color: white;
    font-weight: 800;
    font-size: 1.1rem;
}

/* =========================
   FEEDBACK
========================= */

#feedback {
    min-height: 28px;
    margin-top: 12px;
    font-weight: 800;
    opacity: 0;
    transition: opacity 0.15s ease;
}

#feedback.show {
    opacity: 1;
}

.feedbackCorrect {
    color: #65e6a5;
}

.feedbackWrong {
    color: #ff6578;
}

/* =========================
   LEVEL EFFECTS
========================= */

body.level2 {
    background: #0b0b1c;
}

body.level3 {
    background: #100b1c;
}

body.level4 {
    background: #170a1c;
}

body.level5 {
    background: #1c090f;
}

body.level6 {
    background: #190a0a;
}

body.level7 {
    background: #100c1c;
}

body.level8 {
    background: #0c151c;
}

body.level9 {
    background: #180d19;
}

body.level10 {
    background: #050505;
}

body.level3 .questionCard {
    transform: rotate(-0.4deg);
}

body.level4 .questionCard {
    animation: cardWobble 2s infinite ease-in-out;
}

body.level5 .numButton:nth-child(odd) {
    transform: rotate(1deg);
}

body.level6 .question {
    animation: textWobble 0.8s infinite;
}

body.level7 .questionCard {
    border-radius: 5px 30px 8px 25px;
}

body.level8 .numButton {
    border-radius: 3px 20px 5px 15px;
}

body.level9 .question {
    letter-spacing: 0.04em;
}

body.level10 {
    animation: backgroundChaos 2.5s infinite;
}

body.level10 .questionCard {
    animation:
        cardWobble 0.6s infinite ease-in-out,
        hueSpin 3s infinite linear;
}

body.level10 .numButton {
    animation: buttonChaos 0.7s infinite alternate;
}

@keyframes cardWobble {
    0% {
        transform: rotate(-0.7deg);
    }

    50% {
        transform: rotate(0.7deg) scale(1.005);
    }

    100% {
        transform: rotate(-0.7deg);
    }
}

@keyframes textWobble {
    0% {
        transform: translateX(-1px);
    }

    50% {
        transform: translateX(1px) rotate(0.5deg);
    }

    100% {
        transform: translateX(-1px);
    }
}

@keyframes backgroundChaos {
    0% {
        filter: hue-rotate(0deg);
    }

    50% {
        filter: hue-rotate(80deg);
    }

    100% {
        filter: hue-rotate(0deg);
    }
}

@keyframes hueSpin {
    from {
        filter: hue-rotate(0deg);
    }

    to {
        filter: hue-rotate(360deg);
    }
}

@keyframes buttonChaos {
    from {
        transform: rotate(-2deg) scale(0.98);
    }

    to {
        transform: rotate(2deg) scale(1.02);
    }
}

/* =========================
   HIT EFFECTS
========================= */

.correctFlash {
    animation: correctFlash 0.25s ease;
}

@keyframes correctFlash {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.025);
    }

    100% {
        transform: scale(1);
    }
}

.wrongShake {
    animation: wrongShake 0.35s ease;
}

@keyframes wrongShake {
    0%,
    100% {
        transform: translateX(0);
    }

    20% {
        transform: translateX(-7px);
    }

    40% {
        transform: translateX(7px);
    }

    60% {
        transform: translateX(-5px);
    }

    80% {
        transform: translateX(5px);
    }
}

.screenShake {
    animation: screenShake 0.35s ease;
}

@keyframes screenShake {
    0%,
    100% {
        transform: translate(0, 0);
    }

    20% {
        transform: translate(-6px, 3px);
    }

    40% {
        transform: translate(6px, -3px);
    }

    60% {
        transform: translate(-4px, -2px);
    }

    80% {
        transform: translate(4px, 2px);
    }
}

.screenFlash {
    animation: screenFlash 0.2s ease;
}

@keyframes screenFlash {
    0% {
        filter: brightness(1);
    }

    50% {
        filter: brightness(2);
    }

    100% {
        filter: brightness(1);
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {
    #app {
        width: 100%;
        padding: 12px;
    }

    .questionCard {
        padding: 22px 14px;
    }

    .numButton {
        min-height: 62px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- START -->
    <section id="startScreen" class="screen">

        <div class="logo">ADD.</div>

        <div class="subtitle">
            1,000 questions. 10 levels.
        </div>

        <button
            id="startButton"
            class="startButton"
            type="button"
        >
            BEGIN
        </button>

    </section>


    <!-- GAME -->
    <section id="gameScreen" class="screen hidden">

        <div class="topBar">

            <div
                id="levelLabel"
                class="levelLabel"
            >
                LEVEL 1
            </div>

            <div
                id="progressText"
                class="progressText"
            >
                1 / 100
            </div>

        </div>

        <div class="progressBar">
            <div
                id="progressFill"
                class="progressFill"
            ></div>
        </div>

        <div
            id="questionCard"
            class="questionCard"
        >

            <div
                id="question"
                class="question"
            >
                0 + 0
            </div>

            <div
                id="answer"
                class="answer"
            >
                _
            </div>

            <div class="stats">

                <div>
                    Correct:
                    <span
                        id="correctCount"
                        class="correctStat"
                    >
                        0
                    </span>
                </div>

                <div>
                    Wrong:
                    <span
                        id="wrongCount"
                        class="wrongStat"
                    >
                        0
                    </span>
                </div>

            </div>

            <div
                id="feedback"
            ></div>

        </div>


        <div class="numpad">

            <button class="numButton" data-number="1">1</button>
            <button class="numButton" data-number="2">2</button>
            <button class="numButton" data-number="3">3</button>

            <button class="numButton" data-number="4">4</button>
            <button class="numButton" data-number="5">5</button>
            <button class="numButton" data-number="6">6</button>

            <button class="numButton" data-number="7">7</button>
            <button class="numButton" data-number="8">8</button>
            <button class="numButton" data-number="9">9</button>

            <button
                id="deleteButton"
                class="numButton deleteButton"
            >
                DELETE
            </button>

            <button
                class="numButton zeroButton"
                data-number="0"
            >
                0
            </button>

            <button
                id="enterButton"
                class="numButton enterButton"
            >
                ENTER
            </button>

        </div>

    </section>


    <!-- FINISH -->
    <section id="finishScreen" class="screen hidden">

        <div class="finishTitle">
            DONE.
        </div>

        <div class="finalStats">

            <div>
                Correct
            </div>

            <div
                id="finalCorrect"
                class="finalNumber correctStat"
            >
                0
            </div>

            <div>
                Wrong
            </div>

            <div
                id="finalWrong"
                class="finalNumber wrongStat"
            >
                0
            </div>

        </div>

        <button
            id="restartButton"
            class="finishButton"
            type="button"
        >
            START OVER
        </button>

    </section>

</div>


<script>
"use strict";

/* =========================================================
   GAME STATE
========================================================= */

const QUESTIONS_PER_LEVEL = 100;
const TOTAL_LEVELS = 10;

let level = 1;
let questionNumber = 0;

let correct = 0;
let wrong = 0;

let currentAnswer = 0;
let currentInput = "";

let accepting = false;
let started = false;

let chaosInterval = null;


/* =========================================================
   DOM
========================================================= */

const startScreen =
    document.getElementById("startScreen");

const gameScreen =
    document.getElementById("gameScreen");

const finishScreen =
    document.getElementById("finishScreen");

const startButton =
    document.getElementById("startButton");

const restartButton =
    document.getElementById("restartButton");

const levelLabel =
    document.getElementById("levelLabel");

const progressText =
    document.getElementById("progressText");

const progressFill =
    document.getElementById("progressFill");

const question =
    document.getElementById("question");

const answer =
    document.getElementById("answer");

const correctCount =
    document.getElementById("correctCount");

const wrongCount =
    document.getElementById("wrongCount");

const feedback =
    document.getElementById("feedback");

const questionCard =
    document.getElementById("questionCard");

const finalCorrect =
    document.getElementById("finalCorrect");

const finalWrong =
    document.getElementById("finalWrong");

const numberButtons =
    document.querySelectorAll("[data-number]");

const deleteButton =
    document.getElementById("deleteButton");

const enterButton =
    document.getElementById("enterButton");


/* =========================================================
   AUDIO
   =========================================================

   Both MP3 files are expected to be in the SAME folder
   as this HTML file:

       index.html
       Wrong.mp3
       Correct.mp3

   Web Audio is used instead of <audio>, so there are no
   audio controls placed in the page.
========================================================= */

let audioContext = null;

let wrongBuffer = null;
let correctBuffer = null;

let currentSoundSource = null;

let audioLoading = false;
let audioLoaded = false;


/* Create ONE AudioContext and reuse it. */
function initializeAudio() {

    if (audioContext) {
        return audioContext;
    }

    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContextClass) {
        console.error(
            "Web Audio API is not supported by this browser."
        );

        return null;
    }

    audioContext = new AudioContextClass();

    return audioContext;
}


/*
    Load one MP3.

    new URL(file, document.baseURI)

    resolves the filename relative to the HTML document.
*/
async function loadSound(file) {

    const context = initializeAudio();

    if (!context) {
        throw new Error(
            "Could not create AudioContext."
        );
    }

    const soundURL =
        new URL(file, document.baseURI);

    console.log(
        "Loading sound:",
        soundURL.href
    );

    const response =
        await fetch(soundURL.href, {
            cache: "no-store"
        });

    if (!response.ok) {
        throw new Error(
            `${file} returned HTTP ${response.status}`
        );
    }

    const data =
        await response.arrayBuffer();

    if (!data.byteLength) {
        throw new Error(
            `${file} is empty.`
        );
    }

    const buffer =
        await context.decodeAudioData(data);

    console.log(
        "Loaded sound:",
        file
    );

    return buffer;
}


/*
    Load BOTH sounds before the game starts.

    This prevents the first few answers from happening
    before the MP3 files have finished loading.
*/
async function loadAudio() {

    if (audioLoaded) {
        return true;
    }

    if (audioLoading) {
        return false;
    }

    audioLoading = true;

    try {

        initializeAudio();

        wrongBuffer =
            await loadSound("Wrong.mp3");

        correctBuffer =
            await loadSound("Correct.mp3");

        audioLoaded = true;

        console.log(
            "ADD. audio loaded successfully."
        );

        return true;

    } catch (error) {

        console.error(
            "ADD. audio failed to load:",
            error
        );

        audioLoaded = false;

        return false;

    } finally {

        audioLoading = false;

    }
}


/*
    Start/resume audio.

    This is called from the BEGIN button so the browser
    sees it as part of a user interaction.
*/
async function activateAudio() {

    const context =
        initializeAudio();

    if (!context) {
        return false;
    }

    try {

        if (context.state === "suspended") {
            await context.resume();
        }

        return context.state === "running";

    } catch (error) {

        console.error(
            "Could not activate audio:",
            error
        );

        return false;
    }
}


/*
    Stop the currently playing sound.

    This guarantees that Wrong.mp3 and Correct.mp3
    cannot overlap.
*/
function stopCurrentSound() {

    if (!currentSoundSource) {
        return;
    }

    try {
        currentSoundSource.stop();
    } catch (error) {
        // Already stopped.
    }

    try {
        currentSoundSource.disconnect();
    } catch (error) {
        // Already disconnected.
    }

    currentSoundSource = null;
}


/*
    Play an AudioBuffer.
*/
async function playSound(buffer) {

    if (!buffer) {
        console.warn(
            "Requested sound has not loaded yet."
        );

        return;
    }

    const context =
        initializeAudio();

    if (!context) {
        return;
    }

    try {

        if (context.state === "suspended") {
            await context.resume();
        }

        /*
            Stop whatever sound is currently playing.
        */
        stopCurrentSound();

        const source =
            context.createBufferSource();

        source.buffer = buffer;

        source.connect(
            context.destination
        );

        currentSoundSource = source;

        source.onended = () => {

            if (
                currentSoundSource === source
            ) {
                currentSoundSource = null;
            }

            try {
                source.disconnect();
            } catch (error) {}

        };

        source.start(0);

    } catch (error) {

        console.error(
            "Could not play sound:",
            error
        );

    }
}


/*
    Wrong.mp3
    Plays EVERY time the user gets an answer wrong.
*/
function playWrongSound() {
    playSound(wrongBuffer);
}


/*
    Correct.mp3
    Only called on every 10th correct answer.
*/
function playCorrectSound() {
    playSound(correctBuffer);
}


/* =========================================================
   QUESTION GENERATION
========================================================= */

function randomDigit() {
    return Math.floor(Math.random() * 10);
}


function randomNDigitNumber(digits) {

    if (digits <= 1) {
        return randomDigit();
    }

    const minimum =
        Math.pow(10, digits - 1);

    const maximum =
        Math.pow(10, digits) - 1;

    return Math.floor(
        Math.random() *
        (maximum - minimum + 1)
    ) + minimum;
}


function generateQuestion() {

    let a;
    let b;

    /*
        Level 1:
        single digit.

        Level 2:
        two-digit.

        ...

        Level 10:
        ten-digit.
    */

    const digits = level;

    a =
        randomNDigitNumber(digits);

    b =
        randomNDigitNumber(digits);

    currentAnswer = a + b;

    question.textContent =
        `${a} + ${b}`;

    currentInput = "";

    updateAnswerDisplay();
}


/* =========================================================
   DISPLAY
========================================================= */

function updateAnswerDisplay() {

    answer.textContent =
        currentInput === ""
            ? "_"
            : currentInput;
}


function updateStats() {

    correctCount.textContent =
        correct;

    wrongCount.textContent =
        wrong;
}


function updateProgress() {

    progressText.textContent =
        `${questionNumber + 1} / ${QUESTIONS_PER_LEVEL}`;

    const percentage =
        (questionNumber /
            QUESTIONS_PER_LEVEL) * 100;

    progressFill.style.width =
        `${percentage}%`;
}


function updateLevelDisplay() {

    levelLabel.textContent =
        `LEVEL ${level}`;

    document.body.className =
        `level${level}`;

    updateProgress();
}


/* =========================================================
   FEEDBACK
========================================================= */

function showFeedback(text, isCorrect) {

    feedback.textContent =
        text;

    feedback.className =
        isCorrect
            ? "feedbackCorrect show"
            : "feedbackWrong show";

    clearTimeout(
        showFeedback.timeout
    );

    showFeedback.timeout =
        setTimeout(() => {

            feedback.className = "";

        }, 500);
}


/* =========================================================
   CORRECT
========================================================= */

function handleCorrect() {

    if (!accepting) {
        return;
    }

    accepting = false;

    correct++;

    /*
        CORRECT AUDIO:
        10th
        20th
        30th
        40th
        etc.
    */
    if (correct % 10 === 0) {
        playCorrectSound();
    }

    showFeedback(
        "CORRECT",
        true
    );

    questionCard.classList.remove(
        "correctFlash"
    );

    void questionCard.offsetWidth;

    questionCard.classList.add(
        "correctFlash"
    );

    questionNumber++;

    updateStats();

    if (
        questionNumber >=
        QUESTIONS_PER_LEVEL
    ) {

        setTimeout(
            nextLevel,
            250
        );

        return;
    }

    updateProgress();

    setTimeout(
        nextQuestion,
        250
    );
}


/* =========================================================
   WRONG
========================================================= */

function handleWrong() {

    if (!accepting) {
        return;
    }

    accepting = false;

    wrong++;

    /*
        WRONG AUDIO:
        EVERY wrong answer.
    */
    playWrongSound();

    showFeedback(
        "WRONG",
        false
    );

    answer.classList.remove(
        "wrongShake"
    );

    void answer.offsetWidth;

    answer.classList.add(
        "wrongShake"
    );

    /*
        Starting at level 4, shake the whole screen.
    */
    if (level >= 4) {

        document.body.classList.remove(
            "screenShake"
        );

        void document.body.offsetWidth;

        document.body.classList.add(
            "screenShake"
        );
    }

    /*
        Starting at level 6, flash the screen.
    */
    if (level >= 6) {

        document.body.classList.remove(
            "screenFlash"
        );

        void document.body.offsetWidth;

        document.body.classList.add(
            "screenFlash"
        );
    }

    updateStats();

    setTimeout(() => {

        currentInput = "";

        updateAnswerDisplay();

        accepting = true;

    }, 350);
}


/* =========================================================
   ANSWER SUBMISSION
========================================================= */

function submitAnswer() {

    if (!accepting) {
        return;
    }

    if (currentInput === "") {
        return;
    }

    const entered =
        Number(currentInput);

    if (
        Number.isFinite(entered) &&
        entered === currentAnswer
    ) {

        handleCorrect();

    } else {

        handleWrong();

    }
}


/* =========================================================
   INPUT
========================================================= */

function addNumber(number) {

    if (!accepting) {
        return;
    }

    /*
        Prevent unnecessarily enormous input.
    */
    if (currentInput.length >= 12) {
        return;
    }

    /*
        Don't allow leading zeroes.
    */
    if (
        currentInput === "0" &&
        number === 0
    ) {
        return;
    }

    if (
        currentInput === "0" &&
        number !== 0
    ) {
        currentInput =
            String(number);
    } else {
        currentInput +=
            String(number);
    }

    updateAnswerDisplay();
}


function deleteNumber() {

    if (!accepting) {
        return;
    }

    currentInput =
        currentInput.slice(0, -1);

    updateAnswerDisplay();
}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion() {

    if (!started) {
        return;
    }

    generateQuestion();

    accepting = true;
}


/* =========================================================
   LEVEL TRANSITION
========================================================= */

function nextLevel() {

    if (
        level >= TOTAL_LEVELS
    ) {

        finishGame();

        return;
    }

    level++;

    questionNumber = 0;

    currentInput = "";

    updateLevelDisplay();

    generateQuestion();

    accepting = true;

    startChaosEffects();
}


/* =========================================================
   CHAOS
========================================================= */

function startChaosEffects() {

    clearInterval(
        chaosInterval
    );

    if (level < 10) {
        return;
    }

    /*
        Level 10 becomes progressively more chaotic.
    */
    chaosInterval =
        setInterval(() => {

            if (!started) {
                return;
            }

            const rotation =
                Math.random() * 8 - 4;

            const scale =
                0.98 +
                Math.random() * 0.04;

            questionCard.style.transform =
                `rotate(${rotation}deg) scale(${scale})`;

            setTimeout(() => {

                questionCard.style.transform =
                    "";

            }, 350);

        }, 2500);
}


/* =========================================================
   START GAME
========================================================= */

async function startGame() {

    /*
        IMPORTANT:

        This happens immediately inside the button click.
        That gives the AudioContext a valid user gesture
        to resume on browsers such as iOS Safari.
    */
    await activateAudio();

    /*
        Load the MP3 files before accepting answers.
    */
    const soundsReady =
        await loadAudio();

    if (!soundsReady) {

        console.warn(
            "The game will continue, but audio could not be loaded."
        );
    }

    started = true;

    level = 1;

    questionNumber = 0;

    correct = 0;

    wrong = 0;

    currentInput = "";

    accepting = false;

    clearInterval(
        chaosInterval
    );

    startScreen.classList.add(
        "hidden"
    );

    finishScreen.classList.add(
        "hidden"
    );

    gameScreen.classList.remove(
        "hidden"
    );

    updateStats();

    updateLevelDisplay();

    generateQuestion();

    accepting = true;

    startChaosEffects();
}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame() {

    started = false;

    accepting = false;

    clearInterval(
        chaosInterval
    );

    stopCurrentSound();

    gameScreen.classList.add(
        "hidden"
    );

    finishScreen.classList.remove(
        "hidden"
    );

    finalCorrect.textContent =
        correct;

    finalWrong.textContent =
        wrong;
}


/* =========================================================
   RESTART
========================================================= */

function restartGame() {

    finishScreen.classList.add(
        "hidden"
    );

    startScreen.classList.remove(
        "hidden"
    );

    document.body.className = "";

    currentInput = "";

    progressFill.style.width =
        "0%";
}


/* =========================================================
   NUMPAD EVENTS
========================================================= */

numberButtons.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            const number =
                Number(
                    button.dataset.number
                );

            addNumber(number);
        }
    );

});


deleteButton.addEventListener(
    "click",
    deleteNumber
);


enterButton.addEventListener(
    "click",
    submitAnswer
);


/* =========================================================
   PHYSICAL KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (!started) {
            return;
        }

        if (
            event.key >= "0" &&
            event.key <= "9"
        ) {

            event.preventDefault();

            addNumber(
                Number(event.key)
            );

            return;
        }

        if (
            event.key ===
            "Backspace"
        ) {

            event.preventDefault();

            deleteNumber();

            return;
        }

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            submitAnswer();

        }

    }
);


/* =========================================================
   BUTTON EVENTS
========================================================= */

startButton.addEventListener(
    "click",
    startGame
);


restartButton.addEventListener(
    "click",
    restartGame
);


/* =========================================================
   PRELOAD AUDIO
   =========================================================

   Start loading the sounds immediately so that by the time
   the player reaches the first 10th correct answer, the
   buffers should already be available.

   The actual playback still waits for the BEGIN interaction
   to resume the AudioContext.
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        initializeAudio();

        loadAudio();

    }
);
</script>

</body>
